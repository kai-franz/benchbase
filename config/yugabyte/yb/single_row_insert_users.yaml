type: YUGABYTE
driver: com.yugabyte.Driver
url: jdbc:yugabytedb://{{endpoint}}:5433/{{database}}?sslmode=disable&ApplicationName=featurebench&reWriteBatchedInserts=true&load-balance=true
username: {{username}}
password: {{password}}
batchsize: 1
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: {{connections}}
collect_pg_stat_statements: true
works:
    work:
        time_secs: 600
        active_terminals: {{connections}}
        rate: unlimited
        warmup: 60
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
            - DROP TABLE IF EXISTS users_single_row;
            - |
              CREATE TABLE users_single_row (
                id            BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                email         VARCHAR(255) NOT NULL,
                password_hash TEXT         NOT NULL,
                full_name     VARCHAR(200),
                phone         VARCHAR(32),
                locale        VARCHAR(10)  DEFAULT 'en_US',
                time_zone     VARCHAR(64)  DEFAULT 'UTC',
                role          VARCHAR(32)  NOT NULL DEFAULT 'user',
                is_active     BOOLEAN      NOT NULL DEFAULT TRUE,
                metadata      JSONB        NOT NULL DEFAULT '{}'::jsonb,
                created_at    TIMESTAMPTZ  NOT NULL DEFAULT now(),
                updated_at    TIMESTAMPTZ  NOT NULL DEFAULT now(),
                last_login_at TIMESTAMPTZ,
                deleted_at    TIMESTAMPTZ
              );
        loadRules:
            - table: users_single_row
              rows: 0
              columns:
                  - name: id
                    util: PrimaryIntGen
                    params: [ 1, 1 ]
        cleanup:
            - DROP TABLE IF EXISTS users_single_row;
        executeRules:
            - workload: single_row_insert_users
              run:
                  - name: single_row_insert
                    weight: 100
                    queries:
                        - query: |
                            INSERT INTO users_single_row (
                              email,
                              password_hash,
                              full_name,
                              phone,
                              locale,
                              time_zone,
                              role,
                              is_active,
                              metadata,
                              last_login_at,
                              deleted_at
                            )
                            VALUES (
                              concat('user', ?, '@example.com'),
                              ?,
                              ?,
                              ?,
                              ?,
                              ?,
                              ?,
                              ?,
                              ?::jsonb,
                              now(),
                              NULL
                            )
                          count: 1
                          bindings:
                              - util: PrimaryIntGen
                                params: [ 1, 1000000000 ]
                              - util: HashedRandomString
                                params: [ 1, 1000000, 64 ]
                              - util: RandomAString
                                params:
                                    - 10
                                    - 30
                              - util: RandomAString
                                params:
                                    - 10
                                    - 10
                              - util: OneStringFromArray
                                params: [ "en_US", "fr_FR", "es_ES", "de_DE" ]
                              - util: OneStringFromArray
                                params: [ "UTC", "America/Los_Angeles", "Europe/Berlin", "Asia/Kolkata" ]
                              - util: OneStringFromArray
                                params: [ "user", "admin", "moderator" ]
                              - util: RandomBoolean
                              - util: RandomJson
                                params:
                                    - 3
                                    - 12
