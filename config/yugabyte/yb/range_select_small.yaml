type: YUGABYTE
driver: com.yugabyte.Driver
url: jdbc:yugabytedb://{{endpoint}}:5433/{{database}}?sslmode=disable&ApplicationName=featurebench&reWriteBatchedInserts=true&load-balance=true
username: {{username}}
password: {{password}}
batchsize: 1024
isolation: TRANSACTION_REPEATABLE_READ
loaderthreads: 1
terminals: {{connections}}
collect_pg_stat_statements: true
works:
    work:
        time_secs: 600
        active_terminals: {{connections}}
        rate: unlimited
        warmup: 60
microbenchmark:
    class: com.oltpbenchmark.benchmarks.featurebench.customworkload.YBDefaultMicroBenchmark
    properties:
        setAutoCommit: true
        create:
            - DROP TABLE IF EXISTS users_select_small;
            - |
              CREATE TABLE users_select_small (
                id            BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                email         VARCHAR(255) NOT NULL,
                password_hash TEXT         NOT NULL,
                full_name     VARCHAR(200),
                phone         VARCHAR(32),
                locale        VARCHAR(10)  DEFAULT 'en_US',
                time_zone     VARCHAR(64)  DEFAULT 'UTC',
                role          VARCHAR(32)  NOT NULL DEFAULT 'user',
                is_active     BOOLEAN      NOT NULL DEFAULT TRUE,
                metadata      JSONB        NOT NULL DEFAULT '{}'::jsonb,
                created_at    TIMESTAMPTZ  NOT NULL DEFAULT now(),
                updated_at    TIMESTAMPTZ  NOT NULL DEFAULT now(),
                last_login_at TIMESTAMPTZ,
                deleted_at    TIMESTAMPTZ
              );
        loadRules:
            - table: users_select_small
              rows: 1000000
              columns:
                  - name: email
                    util: RandomAString
                    params:
                        - 16
                        - 16
                  - name: password_hash
                    util: HashedRandomString
                    params: [ 1, 1000000, 64 ]
                  - name: full_name
                    util: RandomAString
                    params:
                        - 10
                        - 30
                  - name: phone
                    util: RandomAString
                    params:
                        - 10
                        - 10
                  - name: locale
                    util: OneStringFromArray
                    params: [ "en_US", "fr_FR", "es_ES", "de_DE" ]
                  - name: time_zone
                    util: OneStringFromArray
                    params: [ "UTC", "America/Los_Angeles", "Europe/Berlin", "Asia/Kolkata" ]
                  - name: role
                    util: OneStringFromArray
                    params: [ "user", "admin", "moderator" ]
                  - name: is_active
                    util: RandomBoolean
                  - name: metadata
                    util: RandomJson
                    params:
                        - 3
                        - 12
                  - name: created_at
                    util: RandomTimestampWithTimeZone
                    params: [ 1000000 ]
                  - name: updated_at
                    util: RandomTimestampWithTimeZone
                    params: [ 1000000 ]
                  - name: last_login_at
                    util: RandomTimestampWithTimeZone
                    params: [ 1000000 ]
                  - name: deleted_at
                    util: RandomTimestampWithTimeZone
                    params: [ 1000000 ]
        cleanup:
            - DROP TABLE IF EXISTS users_select_small;
        executeRules:
            - workload: range_select_users_small
              run:
                  - name: range_select_100
                    weight: 100
                    queries:
                        - query: |
                            WITH base AS (
                              SELECT ?::bigint AS s
                            )
                            SELECT *
                            FROM users_select_small
                            WHERE id >= (SELECT s FROM base)
                              AND id <= (SELECT s + 99 FROM base)
                            ORDER BY id
                          count: 100
                          bindings:
                              - util: PrimaryIntGen
                                params: [ 1, 999901 ]

